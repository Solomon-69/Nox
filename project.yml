name: DarkSwitch
options:
  bundleIdPrefix: com.solomon
  deploymentTarget: {macOS: "13.0"}
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  DarkSwitch:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: DarkSwitchExtension
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Nox
        CFBundleDisplayName: Nox
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSAppleEventsUsageDescription: "Nox uses System Events to switch your Mac between light and dark mode."
        NSHumanReadableCopyright: "Copyright © 2026 Solomon. MIT License."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomon.DarkSwitch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
  DarkSwitchExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Extension/Resources
        buildPhase: resources
    info:
      path: Extension/Info.plist
      properties:
        CFBundleName: Nox Extension
        CFBundleDisplayName: Nox
        NSHumanReadableCopyright: "Copyright © 2026 Solomon. MIT License."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.shared-preference.read-only:
          - com.solomon.DarkSwitch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomon.DarkSwitch.Extension
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
